# Tests StackPad, then builds the Windows and Linux installers on GitHub's
# machines. A Linux build can't be made on Windows, so this is how the Linux
# files are made.
#
# - Pushing a tag such as v2.2.0 also creates a draft release with every file
#   the website and the auto-updater need. Publish the draft to ship it.
# - Pushing a release/* branch only builds, for downloading from the run.
#
# Optional: a Microsoft Store package, built when the MS_STORE_* repository
# variables are set (see docs/MICROSOFT-STORE.md).
name: Build installers

on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/StackPad.v*.exe
            dist/StackPad.v*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  linux:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux AppImage deb --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/StackPad.v*.AppImage
            dist/StackPad.v*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  store:
    needs: test
    if: github.event_name != 'pull_request' && vars.MS_STORE_IDENTITY_NAME != ''
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Store signs the package itself, so it's uploaded unsigned.
      - run: >
          npx electron-builder --win appx --publish never
          "-c.appx.identityName=${{ vars.MS_STORE_IDENTITY_NAME }}"
          "-c.appx.publisher=${{ vars.MS_STORE_PUBLISHER }}"
          "-c.appx.publisherDisplayName=${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}"
      - uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-package
          path: dist/*.appx
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --draft --title "StackPad $GITHUB_REF_NAME" --notes-file notes.md
          --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
