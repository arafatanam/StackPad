<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>StackPad</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <nav id="sidebar" class="collapsed">
        <div id="tab-list"></div>
        <button
          id="new-tab-btn-bottom"
          class="sidebar-new sidebar-new-bottom"
          title="New tab (Ctrl+N)"
        >
          <svg
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
      </nav>

      <div id="content-shell">
        <header class="topbar">
          <div class="ratio-group" aria-label="Window ratio selector">
            <div class="custom-select">
              <button
                id="ratio-select"
                class="select-trigger"
                type="button"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span class="select-value">4:5</span>
              </button>
              <div
                class="select-menu"
                role="listbox"
                aria-label="Select screen ratio"
              >
                <button
                  type="button"
                  class="select-option selected"
                  data-value="4:5"
                  role="option"
                >
                  4:5
                </button>
                <button
                  type="button"
                  class="select-option"
                  data-value="16:9"
                  role="option"
                >
                  16:9
                </button>
                <button
                  type="button"
                  class="select-option"
                  data-value="custom"
                  role="option"
                >
                  Custom
                </button>
              </div>
            </div>
          </div>
        </header>

        <main id="editor-area">
          <textarea
            id="editor"
            spellcheck="true"
            wrap="soft"
            autofocus
          ></textarea>
        </main>
      </div>
    </div>

    <footer id="status-bar">
      <span id="status-position">Ln 1, Col 1</span>
      <span id="status-count">0 characters</span>
      <span id="status-wrap">Word Wrap</span>
      <span id="status-zoom">100%</span>
    </footer>

    <dialog id="find-dialog">
      <form id="find-form">
        <div class="find-header">
          <span class="find-title">Find</span>

          <button
            id="find-close-btn"
            class="find-close-btn"
            type="button"
            aria-label="Close Find"
            title="Close"
          >
            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="6" y1="6" x2="18" y2="18" />
              <line x1="18" y1="6" x2="6" y2="18" />
            </svg>
          </button>
        </div>

        <div class="find-input-row">
          <input
            id="find-input"
            type="text"
            placeholder="Find"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="find-footer">
          <span id="find-status" class="dialog-status"></span>

          <button id="find-prev-btn" type="button">Previous</button>

          <button id="find-next-btn" type="button">Next</button>
        </div>
      </form>
    </dialog>

    <dialog id="replace-dialog">
      <form id="replace-form">
        <div class="find-header">
          <span class="find-title">Replace</span>

          <button
            id="replace-close-btn"
            class="find-close-btn"
            type="button"
            aria-label="Close Replace"
            title="Close"
          >
            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="6" y1="6" x2="18" y2="18" />
              <line x1="18" y1="6" x2="6" y2="18" />
            </svg>
          </button>
        </div>

        <div class="find-input-row">
          <input
            id="replace-find-input"
            type="text"
            placeholder="Find"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="find-input-row">
          <input
            id="replace-with-input"
            type="text"
            placeholder="Replace with"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="find-footer">
          <span id="replace-status" class="dialog-status"></span>

          <button id="replace-next-btn" type="button">Next</button>
          <button id="replace-one-btn" type="button">Replace</button>
          <button id="replace-all-btn" type="button">Replace All</button>
        </div>
      </form>
    </dialog>

    <dialog id="goto-dialog">
      <form method="dialog" id="goto-form">
        <label
          >Line number: <input id="goto-input" type="number" min="1"
        /></label>
        <div class="dialog-actions">
          <button id="goto-ok-btn" type="button">OK</button>
          <button id="goto-close-btn" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="font-dialog">
      <form method="dialog" id="font-form">
        <label
          >Font family:
          <select id="font-family-select">
            <option value="'Consolas', 'Courier New', monospace">
              Consolas (Monospace)
            </option>
            <option value="'Segoe UI', sans-serif">
              Segoe UI (Proportional)
            </option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="Georgia, serif">Georgia</option>
          </select>
        </label>
        <label
          >Font size:
          <input id="font-size-input" type="number" min="8" max="72" value="14"
        /></label>
        <div class="dialog-actions">
          <button id="font-ok-btn" type="button">OK</button>
          <button id="font-close-btn" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="rename-dialog">
      <form method="dialog" id="rename-form">
        <label>Tab name: <input id="rename-input" type="text" /></label>
        <div class="dialog-actions">
          <button id="rename-ok-btn" type="button">OK</button>
          <button id="rename-close-btn" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-dialog">
      <form method="dialog" id="confirm-form">
        <p id="confirm-message" class="confirm-message"></p>
        <div class="dialog-actions">
          <button id="confirm-no-btn" type="button">Cancel</button>
          <button id="confirm-yes-btn" type="button" class="danger-btn">
            Exit
          </button>
        </div>
      </form>
    </dialog>

    <script src="renderer.js"></script>
  </body>
</html>
