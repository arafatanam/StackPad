<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>StackPad</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="window-titlebar"><span>StackPad</span></header>
    <nav id="app-menu-bar" aria-label="Application menu">
      <div class="app-menu">
        <button class="app-menu-trigger" type="button" aria-expanded="false">File</button>
        <div class="app-menu-popup">
          <button data-action="new-tab">New Tab <span>Ctrl+N</span></button>
          <button data-action="open">Open... <span>Ctrl+O</span></button>
          <hr />
          <button data-action="save">Save <span>Ctrl+S</span></button>
          <button data-action="save-as">Save As... <span>Ctrl+Shift+S</span></button>
          <hr />
          <button data-action="print">Print... <span>Ctrl+P</span></button>
          <button data-action="close-tab">Close Tab <span>Ctrl+W</span></button>
          <button data-action="exit">Exit <span>Alt+F4</span></button>
        </div>
      </div>
      <div class="app-menu">
        <button class="app-menu-trigger" type="button" aria-expanded="false">Edit</button>
        <div class="app-menu-popup">
          <button data-action="undo">Undo <span>Ctrl+Z</span></button>
          <button data-action="redo">Redo <span>Ctrl+Y</span></button>
          <hr />
          <button data-action="cut">Cut <span>Ctrl+X</span></button>
          <button data-action="copy">Copy <span>Ctrl+C</span></button>
          <button data-action="paste">Paste <span>Ctrl+V</span></button>
          <button data-action="select-all">Select All <span>Ctrl+A</span></button>
          <hr />
          <button data-action="find">Find... <span>Ctrl+F</span></button>
          <button data-action="find-next">Find Next <span>F3</span></button>
          <button data-action="find-previous">Find Previous <span>Shift+F3</span></button>
          <button data-action="replace">Replace... <span>Ctrl+H</span></button>
          <button data-action="go-to">Go To... <span>Ctrl+G</span></button>
          <button data-action="time-date">Time/Date <span>F5</span></button>
        </div>
      </div>
      <div class="app-menu">
        <button class="app-menu-trigger" type="button" aria-expanded="false">View</button>
        <div class="app-menu-popup">
          <button data-action="word-wrap">Word Wrap <span class="menu-check">✓</span></button>
          <button data-action="font">Font...</button>
          <hr />
          <button data-action="zoom-in">Zoom In <span>Ctrl++</span></button>
          <button data-action="zoom-out">Zoom Out <span>Ctrl+-</span></button>
          <button data-action="zoom-reset">Restore Default Zoom <span>Ctrl+0</span></button>
          <hr />
          <button data-action="status-bar">Status Bar <span class="menu-check">✓</span></button>
          <hr />
          <button data-action="theme-light">Light <span class="menu-check"></span></button>
          <button data-action="theme-dark">Dark <span class="menu-check"></span></button>
          <button data-action="theme-system">Use System Settings <span class="menu-check">✓</span></button>
        </div>
      </div>
      <div class="app-menu">
        <button class="app-menu-trigger" type="button" aria-expanded="false">Screen</button>
        <div class="app-menu-popup">
          <button data-ratio="4:5">4:5 <span class="menu-check">✓</span></button>
          <button data-ratio="16:9">16:9 <span class="menu-check"></span></button>
          <button data-ratio="freeform">Freeform <span class="menu-check"></span></button>
        </div>
      </div>
    </nav>
    <div id="app">
      <nav id="sidebar">
        <div id="tab-list"></div>
        <button
          id="new-tab-btn-bottom"
          class="sidebar-new sidebar-new-bottom"
          title="New tab (Ctrl+N)"
        >
          <svg
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
      </nav>

      <div id="content-shell">
        <header class="topbar">
          <div id="document-title" class="document-title">
            <span id="document-title-text" title="Double-click to rename this tab"></span>
            <span id="document-title-dirty" class="dirty-dot" title="Unsaved changes" hidden></span>
            <input id="document-title-input" type="text" aria-label="Tab title" hidden />
            <span id="document-title-actions" class="document-title-actions" hidden>
              <button id="document-title-confirm" type="button" title="Confirm title" aria-label="Confirm title">✓</button>
              <button id="document-title-cancel" type="button" title="Cancel title edit" aria-label="Cancel title edit">×</button>
            </span>
          </div>
          <section id="find-controls" class="find-controls" hidden>
            <form id="find-form" class="find-controls-row">
              <span class="find-input-wrap">
                <input
                  id="find-input"
                  type="text"
                  placeholder="Find"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="Find"
                />
                <span class="find-options">
                  <button class="find-option-btn" type="button" data-find-option="matchCase" title="Match case" aria-label="Match case" aria-pressed="false">Aa</button>
                  <button class="find-option-btn" type="button" data-find-option="wholeWord" title="Match whole word" aria-label="Match whole word" aria-pressed="false"><span class="whole-word-glyph">ab</span></button>
                </span>
              </span>
              <span id="find-status" class="find-count" aria-live="polite"></span>
              <button id="find-prev-btn" class="find-icon-btn" type="button" title="Previous match" aria-label="Previous match">↑</button>
              <button id="find-next-btn" class="find-icon-btn" type="button" title="Next match" aria-label="Next match">↓</button>
              <button id="show-replace-btn" class="find-icon-btn" type="button" title="Show replace" aria-label="Show replace">↔</button>
              <button id="find-close-btn" class="find-icon-btn" type="button" title="Close find" aria-label="Close find">×</button>
            </form>
            <form id="replace-form" class="find-controls-row replace-controls-row" hidden>
              <span class="find-input-wrap">
                <input
                  id="replace-find-input"
                  type="text"
                  placeholder="Find"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="Find"
                />
                <span class="find-options">
                  <button class="find-option-btn" type="button" data-find-option="matchCase" title="Match case" aria-label="Match case" aria-pressed="false">Aa</button>
                  <button class="find-option-btn" type="button" data-find-option="wholeWord" title="Match whole word" aria-label="Match whole word" aria-pressed="false"><span class="whole-word-glyph">ab</span></button>
                </span>
              </span>
              <input
                id="replace-with-input"
                type="text"
                placeholder="Replace"
                autocomplete="off"
                spellcheck="false"
                aria-label="Replace"
              />
              <span id="replace-status" class="find-count" aria-live="polite"></span>
              <button id="replace-prev-btn" class="find-icon-btn" type="button" title="Previous match" aria-label="Previous match">↑</button>
              <button id="replace-next-btn" class="find-icon-btn" type="button" title="Next match" aria-label="Next match">↓</button>
              <button id="replace-one-btn" class="find-icon-btn" type="button" title="Replace match" aria-label="Replace match">↔</button>
              <button id="replace-all-btn" class="find-icon-btn" type="button" title="Replace all matches" aria-label="Replace all matches">⇄</button>
              <button id="replace-close-btn" class="find-icon-btn" type="button" title="Close replace" aria-label="Close replace">×</button>
            </form>
          </section>
        </header>

        <main id="editor-area">
          <textarea
            id="editor"
            spellcheck="true"
            wrap="soft"
          ></textarea>
        </main>
      </div>
    </div>

    <footer id="status-bar">
      <span id="status-position">Ln 1, Col 1</span>
      <span id="status-words">0 words</span>
      <span id="status-count">0 characters</span>
      <span id="status-wrap">Word Wrap</span>
      <span id="status-zoom" class="status-right">100%</span>
      <span id="status-eol">CRLF</span>
      <span id="status-encoding">UTF-8</span>
    </footer>

    <dialog id="goto-dialog">
      <form method="dialog" id="goto-form">
        <label
          >Line number: <input id="goto-input" type="number" min="1"
        /></label>
        <div class="dialog-actions">
          <button id="goto-ok-btn" type="submit" class="primary-btn">OK</button>
          <button id="goto-close-btn" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="font-dialog">
      <form method="dialog" id="font-form">
        <label
          >Font family:
          <select id="font-family-select">
            <option value="'Consolas', 'Courier New', monospace">
              Consolas (Monospace)
            </option>
            <option value="'Segoe UI', sans-serif">
              Segoe UI (Proportional)
            </option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="Georgia, serif">Georgia</option>
          </select>
        </label>
        <label
          >Font size:
          <input id="font-size-input" type="number" min="8" max="72" value="14"
        /></label>
        <div class="dialog-actions">
          <button id="font-ok-btn" type="submit" class="primary-btn">OK</button>
          <button id="font-close-btn" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="rename-dialog">
      <form method="dialog" id="rename-form">
        <label>Tab name: <input id="rename-input" type="text" /></label>
        <div class="dialog-actions">
          <button id="rename-ok-btn" type="submit" class="primary-btn">OK</button>
          <button id="rename-close-btn" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-dialog">
      <form method="dialog" id="confirm-form">
        <p id="confirm-message" class="confirm-message"></p>
        <div id="confirm-actions" class="dialog-actions"></div>
      </form>
    </dialog>

    <div id="drop-overlay" aria-hidden="true"><span>Drop files to open</span></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="print-area" aria-hidden="true"></div>

    <script src="renderer.js"></script>
  </body>
</html>
